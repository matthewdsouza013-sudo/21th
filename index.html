<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level 21 Unlocked</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Pacifico&family=Syncopate:wght@700&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-gold: #ffcf00;
            --bg-dark: #030308;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            overflow: hidden;
            height: 100vh;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
            color: white;
            perspective: 1000px;
        }

        /* --- IMMERSIVE BACKGROUND --- */
        .celebration-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 20% 40%, rgba(0, 243, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(255, 0, 234, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 207, 0, 0.05) 0%, transparent 60%);
            z-index: 0;
            animation: pulseBg 8s infinite alternate ease-in-out;
        }

        .grid-overlay {
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg) translateY(0);
            z-index: 0;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes pulseBg {
            0% { filter: hue-rotate(0deg) brightness(1); transform: scale(1); }
            100% { filter: hue-rotate(15deg) brightness(1.3); transform: scale(1.05); }
        }
        @keyframes gridMove {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(50px); }
        }

        canvas {
            display: block;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            cursor: crosshair;
            mix-blend-mode: screen;
        }

        /* --- FLASH TRANSITION --- */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 9998;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        /* --- INTRO SCREEN --- */
        .intro-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.95);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.2s cubic-bezier(0.8, 0, 0.2, 1), transform 1.2s cubic-bezier(0.8, 0, 0.2, 1);
        }
        
        .intro-profile {
            width: 180px; 
            height: 180px;
            border-radius: 50%;
            background-color: #111;
            background-image: url('a.jpg');
            background-size: cover;
            background-position: center;
            margin-bottom: 30px;
            box-shadow: 
                0 0 20px var(--neon-blue),
                inset 0 0 20px rgba(0, 243, 255, 0.5),
                0 0 60px rgba(0, 243, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.8);
            position: relative;
            animation: float 4s ease-in-out infinite, pulseProfile 2s infinite alternate;
        }

        .intro-profile::after {
            content: '';
            position: absolute;
            top: -15px; left: -15px; right: -15px; bottom: -15px;
            border-radius: 50%;
            border: 2px dashed var(--neon-pink);
            animation: spin 15s linear infinite;
        }

        .intro-title {
            font-family: 'Syncopate', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink), var(--neon-gold));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            animation: float 4s ease-in-out infinite 0.5s, gradientMove 3s linear infinite;
        }

        .enter-btn {
            padding: 18px 60px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            background: transparent;
            border: 2px solid var(--neon-blue);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        
        .enter-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 243, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .enter-btn:hover {
            box-shadow: 0 0 40px var(--neon-blue), inset 0 0 20px var(--neon-blue);
            background: rgba(0, 243, 255, 0.1);
            transform: scale(1.08);
            border-color: #fff;
        }
        .enter-btn:hover::before { left: 100%; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulseProfile {
            0% { box-shadow: 0 0 20px var(--neon-blue), inset 0 0 20px rgba(0,243,255,0.5); }
            100% { box-shadow: 0 0 40px var(--neon-pink), inset 0 0 40px rgba(255,0,234,0.5); border-color: var(--neon-pink); }
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes gradientMove { 100% { background-position: 200% center; } }

        /* --- UI CONTROLS --- */
        .ui-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            opacity: 0;
            pointer-events: none;
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s;
        }

        .ui-container.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }

        .buttons-row {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px;
            border-radius: 50px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 10px rgba(255,255,255,0.05);
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            padding: 12px 30px;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn.active, .nav-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 15px #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 5px; left: 50%; transform: translateX(-50%);
            width: 30%; height: 3px;
            background: var(--neon-gold);
            border-radius: 5px;
            box-shadow: 0 0 10px var(--neon-gold);
        }

        /* --- 3D HOLOGRAPHIC CARD --- */
        .card-wrapper {
            position: absolute;
            top: 50%; left: 50%;
            width: 850px;
            max-width: 95%;
            height: 550px;
            transform: translate(-50%, -50%) perspective(2000px) rotateX(20deg) scale(0.8);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s, transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
        }

        .card-wrapper.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) perspective(2000px) rotateX(0deg) scale(1);
        }

        .birthday-card {
            width: 100%;
            height: 100%;
            display: flex;
            background: rgba(15, 15, 20, 0.6);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 40px 80px rgba(0,0,0,0.9), 
                0 0 50px rgba(0, 243, 255, 0.2) inset,
                0 0 20px rgba(255, 0, 234, 0.2) inset;
            backdrop-filter: blur(30px);
            overflow: hidden;
            transform-style: preserve-3d;
            position: relative;
        }

        /* Holographic Glare Effect */
        .card-glare {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.2), transparent 60%);
            opacity: 0;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.3s;
            mix-blend-mode: overlay;
        }

        .card-visual {
            flex: 1.1;
            background-color: #000;
            background-image: url('a2.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        
        .card-visual::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; width: 100%;
            background: linear-gradient(to right, transparent, rgba(15,15,20,1));
        }

        .card-content {
            flex: 1.3;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 5;
        }

        .card-content h2 {
            font-family: 'Pacifico', cursive;
            font-size: 4rem;
            margin: 0 0 20px 0;
            background: linear-gradient(135deg, var(--neon-gold), #ff8c00, var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 20px rgba(255, 207, 0, 0.3);
            transform: translateZ(30px); /* 3D pop */
        }

        .typewriter-text {
            font-size: 1.1rem;
            line-height: 1.9;
            color: #e0e0e0;
            min-height: 200px;
            font-weight: 300;
            transform: translateZ(20px);
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        .close-btn {
            align-self: flex-start;
            margin-top: 30px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-blue));
            border: none;
            color: white;
            padding: 12px 35px;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transform: translateZ(40px);
        }
        
        .close-btn:hover {
            transform: translateZ(40px) scale(1.1);
            box-shadow: 0 15px 30px rgba(255,0,234,0.4);
        }

        @media (max-width: 850px) {
            .birthday-card { flex-direction: column; }
            .card-visual { flex: 0.8; }
            .card-visual::after { background: linear-gradient(to bottom, transparent, rgba(15,15,20,1)); }
            .card-content { padding: 30px; flex: 1.2; }
            .card-content h2 { font-size: 3rem; }
            .buttons-row { gap: 10px; padding: 10px; }
            .nav-btn { padding: 10px 15px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <div class="flash-overlay" id="flash"></div>

    <div class="intro-screen" id="intro">
        <!-- Picture a.jpg goes here -->
        <div class="intro-profile"></div>
        <div class="intro-title">INITIATE LEVEL 21</div>
        <button class="enter-btn" onclick="startApp()">Enter The Universe</button>
    </div>

    <div class="celebration-bg"></div>
    <div class="grid-overlay"></div>
    <canvas id="canvas"></canvas>

    <div class="card-wrapper" id="cardModal">
        <div class="birthday-card" id="tiltCard">
            <div class="card-glare" id="glare"></div>
            <!-- Picture a2.jpg goes here -->
            <div class="card-visual"></div> 
            <div class="card-content">
                <h2>Happy 21st!</h2>
                <div class="typewriter-text" id="msgArea"></div>
                <button class="close-btn" onclick="closeLetter()">RESUME PARTY</button>
            </div>
        </div>
    </div>

    <div class="ui-container" id="ui">
        <div style="font-size: 0.8rem; color: rgba(255,255,255,0.4); letter-spacing: 3px; text-transform: uppercase;">Tap anywhere to ignite fireworks</div>
        <div class="buttons-row">
            <button class="nav-btn active" onclick="warpTo('21', this)">LEVEL 21</button>
            <button class="nav-btn" onclick="warpTo('🥂', this)">CHEERS</button>
            <button class="nav-btn" onclick="openLetter(this)">OPEN CARD</button>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-raising-me-higher-34.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        
        let particles = [];
        let fireworks = [];
        let isWarping = false;
        
        // Setup
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Mouse Tracker
        let mouse = { x: -1000, y: -1000, radius: 150 };
        window.addEventListener('mousemove', e => { 
            mouse.x = e.clientX; 
            mouse.y = e.clientY; 
        });
        window.addEventListener('mouseout', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });
        
        // Tap for fireworks
        window.addEventListener('pointerdown', e => {
            if(document.getElementById('cardModal').classList.contains('active')) return;
            createFirework(e.clientX, e.clientY);
        });

        // --- HIGH-END PARTICLE PHYSICS ---
        class Particle {
            constructor(x, y, color) {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.destX = x;
                this.destY = y;
                this.vx = (Math.random() - 0.5) * 20;
                this.vy = (Math.random() - 0.5) * 20;
                this.size = Math.random() * 2 + 1.5;
                this.color = color || '#00d2ff';
                this.friction = 0.88; 
                this.spring = 0.08;
                this.baseAngle = Math.random() * Math.PI * 2;
                this.orbitRadius = Math.random() * 3;
            }

            update() {
                if (isWarping) {
                    // Hyperspace warp effect during transition
                    let dx = this.x - width/2;
                    let dy = this.y - height/2;
                    this.vx += dx * 0.05;
                    this.vy += dy * 0.05;
                } else {
                    // Add subtle floating orbit when settled
                    this.baseAngle += 0.02;
                    let targetX = this.destX + Math.cos(this.baseAngle) * this.orbitRadius;
                    let targetY = this.destY + Math.sin(this.baseAngle) * this.orbitRadius;

                    let dx = targetX - this.x;
                    let dy = targetY - this.y;
                    
                    this.vx += dx * this.spring;
                    this.vy += dy * this.spring;

                    // Mouse Repulsion Force
                    let mDx = mouse.x - this.x;
                    let mDy = mouse.y - this.y;
                    let dist = Math.sqrt(mDx*mDx + mDy*mDy);
                    if (dist < mouse.radius) {
                        let force = (mouse.radius - dist) / mouse.radius;
                        let angle = Math.atan2(mDy, mDx);
                        this.vx -= Math.cos(angle) * force * 15;
                        this.vy -= Math.sin(angle) * force * 15;
                    }
                }

                this.vx *= this.friction;
                this.vy *= this.friction;
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                // High-performance glow effect
                ctx.globalAlpha = 0.2;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 3.5, 0, Math.PI*2);
                ctx.fill();

                ctx.globalAlpha = 1.0;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // --- UPGRADED FIREWORKS ---
        class FireworkParticle {
            constructor(x, y, isCore) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = isCore ? Math.random() * 4 + 1 : Math.random() * 12 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 2.5 + 1;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.01;
                
                const colors = ['#00f3ff', '#ff00ea', '#ffcf00', '#ffffff'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.isCore = isCore;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.08; // Gravity
                this.vx *= 0.98; // Drag
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life;
                
                if(!this.isCore) {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI*2);
                    ctx.fill();
                }
                
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        function createFirework(x, y) {
            // Flash effect on tap
            const flash = document.getElementById('flash');
            flash.style.opacity = 0.3;
            setTimeout(() => flash.style.opacity = 0, 50);

            for(let i=0; i<80; i++) {
                fireworks.push(new FireworkParticle(x, y, false));
            }
            for(let i=0; i<30; i++) {
                fireworks.push(new FireworkParticle(x, y, true)); // Dense core
            }
        }

        // --- RENDER LOOP ---
        function animate() {
            // Premium motion blur trail
            ctx.fillStyle = 'rgba(3, 3, 8, 0.25)'; 
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => { p.update(); p.draw(); });
            
            for(let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if(fireworks[i].life <= 0) fireworks.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }
        animate();

        // --- SHAPE GENERATOR ---
        function warpTo(text, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            
            closeLetter();
            
            isWarping = true;
            
            // Screen Flash Transition
            const flash = document.getElementById('flash');
            flash.style.opacity = 0.8;
            setTimeout(() => flash.style.opacity = 0, 150);
            
            setTimeout(() => {
                isWarping = false;
                calculateTargets(text);
                createFirework(width/2, height/2);
            }, 400);
        }

        function calculateTargets(text) {
            let tCanvas = document.createElement('canvas');
            let tCtx = tCanvas.getContext('2d');
            tCanvas.width = width;
            tCanvas.height = height;

            let fontSize = Math.min(width / 2.5, 350);
            if(text === '🥂') fontSize = Math.min(width / 3, 250);

            tCtx.font = `900 ${fontSize}px Syncopate, Arial`;
            tCtx.fillStyle = 'white';
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillText(text, width/2, height/2);

            let data = tCtx.getImageData(0, 0, width, height).data;
            let step = window.innerWidth > 768 ? 6 : 9; 
            let newTargets = [];

            for(let y=0; y<height; y+=step) {
                for(let x=0; x<width; x+=step) {
                    if(data[(y*width+x)*4+3] > 128) {
                        let pctX = x / width;
                        let color;
                        if(text === '21') {
                            // Gold to Pink to Cyan gradient
                            if(pctX < 0.4) color = '#ffcf00';
                            else if(pctX < 0.7) color = '#ff00ea';
                            else color = '#00f3ff';
                        } else {
                            color = Math.random() > 0.5 ? '#ffcf00' : '#ffffff';
                        }
                        newTargets.push({x, y, color});
                    }
                }
            }

            // Shuffle array for chaotic crossing paths
            newTargets.sort(() => Math.random() - 0.5);

            if (particles.length < newTargets.length) {
                for (let i = particles.length; i < newTargets.length; i++) {
                    particles.push(new Particle(width/2, height/2)); // Spawn from center
                }
            } else {
                particles.splice(newTargets.length);
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].destX = newTargets[i].x;
                particles[i].destY = newTargets[i].y;
                particles[i].color = newTargets[i].color;
            }
        }

        // --- 3D TILT & GLARE EFFECT ---
        const card = document.getElementById('tiltCard');
        const glare = document.getElementById('glare');
        const cardWrapper = document.getElementById('cardModal');
        
        document.addEventListener('mousemove', (e) => {
            if(!cardWrapper.classList.contains('active')) return;
            
            let rect = cardWrapper.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            let centerX = rect.width / 2;
            let centerY = rect.height / 2;
            
            let rotateX = ((y - centerY) / centerY) * -15; // Max 15deg tilt
            let rotateY = ((x - centerX) / centerX) * 15;
            
            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            
            // Move glare
            glare.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(255,255,255,0.3), transparent 50%)`;
            glare.style.opacity = 1;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            glare.style.opacity = 0;
        });

        // --- CARD / LETTER LOGIC ---
        function openLetter(btnElement) {
            if(btnElement) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            
            // Explode particles outward
            isWarping = true;
            setTimeout(() => {
                isWarping = false;
                particles.forEach(p => {
                    p.destX = Math.random() * width;
                    p.destY = Math.random() * height;
                    p.color = '#fff';
                    p.size = Math.random() * 1;
                });
            }, 300);

            cardWrapper.classList.add('active');
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
            glare.style.opacity = 0;
            
            typeWriter();
        }

        function closeLetter() {
            cardWrapper.classList.remove('active');
        }

        // --- TYPEWRITER ---
        let typed = false;
        function typeWriter() {
            if(typed) return;
            const text = "Welcome to Chapter 21! 🥂\n\nThis is your year to shine, explore, and create unforgettable memories. You've grown into someone absolutely incredible, and the world is lucky to have you.\n\nCheers to the nights we won't remember with the friends we'll never forget. Let's celebrate YOU today!";
            
            const el = document.getElementById('msgArea');
            el.innerHTML = "";
            let i = 0;
            let interval = setInterval(() => {
                if(i < text.length) {
                    el.innerHTML += text.charAt(i) === '\n' ? '<br><br>' : text.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                    typed = true;
                }
            }, 30);
        }

        // --- BOOT SEQUENCE ---
        function startApp() {
            const intro = document.getElementById('intro');
            const flash = document.getElementById('flash');
            
            flash.style.opacity = 1;
            
            setTimeout(() => {
                intro.style.display = 'none';
                flash.style.opacity = 0;
                document.getElementById('ui').classList.add('visible');
                
                let bgMusic = document.getElementById('bgMusic');
                bgMusic.volume = 0.6;
                bgMusic.play().catch(e => console.log("Audio play prevented"));

                warpTo('21');
            }, 500);
        }
    </script>
</body>
</html>
